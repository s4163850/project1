<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Pet</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">
<h2>Add New Pet</h2>

<form onsubmit="return validateForm()">

<input id="name" class="form-control mb-3" placeholder="Pet Name" required>

<select id="status" class="form-control mb-3">
<option value="available">Available</option>
<option value="adopted">Adopted</option>
</select>

<input type="file" id="imageInput" class="form-control mb-3" accept="image/*" required>

<img id="preview" width="200" class="mb-3">

<button class="btn btn-success">Submit</button>

</form>
</div>

<script src="assets/js/script.js"></script>
</body>
</html>
